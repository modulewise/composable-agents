[workspace]
members = [
    "a2a/a2a-client",
    "a2a/a2a-tool",
    "agents/agent-interceptor-support",
    "agents/agent-otel-interceptor",
    "agents/agent-support",
    "agents/chat-agent",
    "agents/tool-calling-agent",
    "models/anthropic-messages-client",
    "models/chat-completions-client",
    "models/model-client-interceptor-support",
    "models/model-client-otel-interceptor",
    "models/model-client-support",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wit-bindgen = "0.63"
