[workspace]
members = [
    "agents/anthropic-messages-client",
    "agents/chat-agent",
    "agents/chat-completions-client",
    "agents/model-client-support",
]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wit-bindgen = "0.63"
