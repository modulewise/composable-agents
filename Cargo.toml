[package]
name = "composable-agents"
version.workspace = true
edition.workspace = true

[workspace]
members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
composable-runtime = { git = "https://github.com/modulewise/composable-runtime", branch = "main", default-features = false }
serde_json = "1"

[dependencies]
anyhow.workspace = true
composable-runtime.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
# composable-runtime's version: the agent's typed bindings run on its store.
wasmtime = { version = "50", features = ["component-model-async"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
