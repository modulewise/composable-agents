# The assistant agent from agent.toml, traced, for run.sh --otel to load in
# its place. The traced-assistant wraps assistant and emits a span for each
# invocation. The assistant imports traced-model, which wraps model and emits a
# span for each model call, as a child of the invocation's span.

[component.traced-assistant]
uri = "oci://localhost:5001/composable-agents/agent-otel-interceptor:latest"
imports = ["assistant", "otel", "clocks", "random"]

[agent.assistant]
model = "traced-model"
toolset = "tools"
description = "Answers arithmetic questions with calculator tools"
version = "0.1.0"
instructions = "Use the calculator tools for every arithmetic step. Answer in one sentence."
report-reasoning = true
report-tool-calls = true

[component.traced-model]
uri = "oci://localhost:5001/composable-agents/model-client-otel-interceptor:latest"
imports = ["model", "otel", "clocks", "random"]

[capability.otel]
type = "otel"
endpoint = "http://localhost:4317"
protocol = "grpc"

[capability.otel.resource]
"service.name" = "tool-calling-agent-example"

[capability.clocks]
type = "wasi:clocks"

[capability.random]
type = "wasi:random"
